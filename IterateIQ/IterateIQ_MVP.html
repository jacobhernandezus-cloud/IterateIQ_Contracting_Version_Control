<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:;"/>
<title>H9 Partners — Contract Management Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Arial',sans-serif}
body{background:#FAF8F4;color:#1E1E1E}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}

/* ── LAYOUT ─────────────────────────────────────────────────────── */
.app{display:flex;height:100vh;overflow:hidden}

/* ── SIDEBAR ────────────────────────────────────────────────────── */
.sidebar{width:238px;min-width:238px;background:#142338;display:flex;flex-direction:column;overflow-y:auto}
.sb-brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-logo{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.5px;font-family:'Geologica',sans-serif}
.sb-logo span{color:#FF8C00}
.sb-tag{font-size:9px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.12em;margin-top:3px}
.sb-section{padding:18px 0 6px}
.sb-lbl{font-size:9px;font-weight:700;color:rgba(255,255,255,.22);text-transform:uppercase;letter-spacing:.13em;padding:0 20px 5px}
.nav-item{display:flex;align-items:center;gap:9px;padding:10px 20px;font-size:13px;color:rgba(255,255,255,.55);cursor:pointer;border-left:3px solid transparent;transition:all .14s;user-select:none}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav-item.active{color:#fff;background:rgba(255,140,0,.14);border-left-color:#FF8C00;font-weight:600}
.nav-badge{margin-left:auto;background:rgba(255,140,0,.22);color:#FFB84D;font-size:10px;font-weight:700;padding:1px 7px;border-radius:8px}
.nav-badge-blue{background:rgba(14,165,233,.2);color:#7dd3fc}
.sb-divider{height:1px;background:rgba(255,255,255,.07);margin:8px 20px}
.contract-nav-item{display:flex;align-items:center;gap:8px;padding:8px 20px;font-size:12px;color:rgba(255,255,255,.45);cursor:pointer;transition:all .14s;user-select:none;border-left:3px solid transparent}
.contract-nav-item:hover{color:rgba(255,255,255,.8);background:rgba(255,255,255,.04)}
.contract-nav-item.active{color:#fff;border-left-color:#0ea5e9;background:rgba(14,165,233,.1);font-weight:600}
.cn-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-footer{padding:14px 20px;border-top:1px solid rgba(255,255,255,.07);margin-top:auto}
.user-row{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#FF8C00,#142338);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.user-name{font-size:13px;font-weight:600;color:#fff}
.user-role{font-size:10px;color:rgba(255,255,255,.38)}
.online-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;margin-left:auto;flex-shrink:0;box-shadow:0 0 6px #22c55e}

/* ── MAIN ───────────────────────────────────────────────────────── */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:15px 28px;background:#fff;border-bottom:1px solid #E8ECF0;position:sticky;top:0;z-index:10;gap:12px}
.topbar-title{font-size:17px;font-weight:700;color:#1a1a2e}
.topbar-sub{font-size:11px;color:#9CA3AF;margin-top:2px}
.content{padding:22px 28px;flex:1}

/* ── BUTTONS ────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;border:none;transition:all .14s;cursor:pointer;white-space:nowrap;line-height:1}
.btn-primary{background:#FF8C00;color:#fff}.btn-primary:hover{background:#E07B00}
.btn-outline{background:#fff;color:#374151;border:1.5px solid #DEE3EB}.btn-outline:hover{background:#F8FAFC;border-color:#CBD5E1}
.btn-blue{background:#0ea5e9;color:#fff}.btn-blue:hover{background:#0284c7}
.btn-danger{background:#fee2e2;color:#dc2626;border:none}.btn-danger:hover{background:#fecaca}
.btn-sm{padding:6px 13px;font-size:12px;border-radius:7px}
.btn-ghost{background:none;border:none;color:#9CA3AF;padding:4px 7px;cursor:pointer;font-size:16px;line-height:1;border-radius:5px}
.btn-ghost:hover{color:#1a1a2e;background:#F1F5F9}
.back-btn{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:#6B7280;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;font-weight:500}
.back-btn:hover{color:#1a1a2e}

/* ── CARDS ──────────────────────────────────────────────────────── */
.card{background:#fff;border-radius:14px;border:1px solid #E8ECF0;overflow:hidden}
.card-hd{padding:15px 20px;border-bottom:1px solid #F0F4F8;display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:700;color:#1a1a2e;letter-spacing:-.01em}
.card-body{padding:20px}

/* ── EARNINGS HERO (Upwork-style) ───────────────────────────────── */
.earn-hero{background:linear-gradient(135deg,#0f1f30 0%,#163352 100%);border-radius:16px;padding:22px 26px;margin-bottom:20px;color:#fff}
.earn-hero-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.earn-greeting{font-size:18px;font-weight:700;color:#fff}
.earn-date{font-size:11px;color:rgba(255,255,255,.4);margin-top:3px}
.earn-period{font-size:11px;font-weight:600;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);padding:5px 12px;border-radius:20px}
.earn-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.09);border-radius:10px;overflow:hidden}
.earn-stat{background:#132840;padding:14px 18px}
.earn-lbl{font-size:9px;font-weight:700;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}
.earn-val{font-size:21px;font-weight:800;color:#fff;line-height:1}
.earn-sub{font-size:10px;color:rgba(255,255,255,.38);margin-top:3px}
.earn-badge{display:inline-flex;align-items:center;gap:2px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:7px;margin-top:5px}
.eb-green{background:rgba(34,197,94,.2);color:#4ade80}
.eb-yellow{background:rgba(234,179,8,.2);color:#fbbf24}
.eb-red{background:rgba(239,68,68,.2);color:#f87171}

/* ── CONTRACT CARDS (Upwork job listing) ────────────────────────── */
.contract-list{display:flex;flex-direction:column;gap:10px}
.contract-card{background:#fff;border-radius:14px;border:1.5px solid #E8ECF0;overflow:hidden;cursor:pointer;transition:all .18s}
.contract-card:hover{box-shadow:0 4px 22px rgba(0,0,0,.09);border-color:#C5D0DE;transform:translateY(-1px)}
.cc-top{padding:16px 20px 12px;display:flex;gap:14px;align-items:flex-start}
.cc-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;font-weight:700;color:#fff}
.cc-info{flex:1;min-width:0}
.cc-name{font-size:15px;font-weight:700;color:#1a1a2e;margin-bottom:1px}
.cc-client{font-size:11px;color:#6B7280;font-weight:500}
.cc-desc{font-size:12px;color:#6B7280;line-height:1.5;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc-right{text-align:right;flex-shrink:0;min-width:90px}
.cc-value{font-size:16px;font-weight:800;color:#1a1a2e}
.cc-earned{font-size:11px;color:#14A800;font-weight:600;margin-top:2px}
.cc-pending{font-size:11px;color:#d97706;font-weight:600}

/* Milestone step indicators */
.ms-steps-row{padding:0 20px 14px;display:flex;align-items:flex-start;gap:0}
.ms-step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative}
.ms-step:last-child{flex:none;min-width:fit-content}
.ms-connector{display:flex;align-items:center;flex:1;width:100%;position:relative;top:-9px}
.ms-connector-line{flex:1;height:2px;background:#E8ECF0}
.ms-connector-line.done{background:#14A800}
.ms-dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;z-index:1}
.ms-dot-done{background:#14A800;color:#fff}
.ms-dot-active{background:#fff;border:2.5px solid #0ea5e9;color:#0ea5e9}
.ms-dot-blocked{background:#fee2e2;border:2px solid #fca5a5;color:#dc2626}
.ms-dot-upcoming{background:#F8FAFC;border:2px solid #CBD5E1;color:#9CA3AF}
.ms-dot-label{font-size:9px;color:#9CA3AF;margin-top:3px;text-align:center;max-width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-dot-price{font-size:9px;font-weight:700;color:#374151;text-align:center}

.cc-bottom{padding:10px 20px;background:#FAFBFC;border-top:1px solid #F0F4F8;display:flex;align-items:center;justify-content:space-between}

/* ── PILLS ──────────────────────────────────────────────────────── */
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.p-active{background:#DCFCE7;color:#16a34a}
.p-paused{background:#FEF9C3;color:#92400e}
.p-complete{background:#E0F2FE;color:#0369a1}
.p-inprogress{background:#E0F2FE;color:#0369a1}
.p-review{background:#F3E8FF;color:#6b21a8}
.p-blocked{background:#FEF2F2;color:#991b1b}
.p-delivered{background:#DCFCE7;color:#15803d}
.p-testing{background:#FFF7ED;color:#92400e}
.p-paid{background:#DCFCE7;color:#15803d}
.p-pending{background:#FEF9C3;color:#92400e}
.p-upcoming{background:#F1F5F9;color:#475569}
.tag{display:inline-flex;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;background:#F1F5F9;color:#475569}

/* ── PROGRESS BAR ───────────────────────────────────────────────── */
.pbar{height:5px;background:#E8ECF0;border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .5s}

/* ── CONTRACT DETAIL ────────────────────────────────────────────── */
.detail-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.dstat{background:#fff;border-radius:12px;border:1px solid #E8ECF0;padding:14px 16px}
.dstat-lbl{font-size:9px;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.dstat-val{font-size:22px;font-weight:800;line-height:1}
.dstat-sub{font-size:11px;color:#9CA3AF;margin-top:3px}

/* Milestone timeline (Toptal-style vertical) */
.ms-timeline{display:flex;flex-direction:column}
.ms-block{display:flex;gap:0;padding:0}
.ms-left{display:flex;flex-direction:column;align-items:center;width:52px;flex-shrink:0}
.ms-num{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.ms-num-done{background:#14A800;color:#fff}
.ms-num-active{background:#fff;border:2.5px solid #0ea5e9;color:#0ea5e9}
.ms-num-blocked{background:#fee2e2;border:2px solid #fca5a5;color:#dc2626}
.ms-num-upcoming{background:#F1F5F9;border:2px solid #CBD5E1;color:#9CA3AF}
.ms-vline{width:2px;flex:1;min-height:20px;margin:4px 0;background:#E8ECF0}
.ms-vline-done{background:#14A800}
.ms-content{flex:1;padding:4px 0 22px 4px}
.ms-title-row{display:flex;align-items:center;gap:10px;margin-bottom:5px;flex-wrap:wrap}
.ms-name{font-size:14px;font-weight:700;color:#1a1a2e}
.ms-price{font-size:14px;font-weight:800;color:#1a1a2e}
.ms-meta-row{display:flex;gap:14px;font-size:11px;color:#9CA3AF;margin-bottom:10px;flex-wrap:wrap}
.ms-deliverables{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.del-item{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:#4B5563}
.del-check-done{color:#14A800;font-size:12px;flex-shrink:0}
.del-check-pending{color:#CBD5E1;font-size:12px;flex-shrink:0}
.ms-feedback-block{background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:9px 12px;font-size:12px;color:#78350f;margin-top:6px;display:flex;align-items:flex-start;gap:7px}

/* ── ACTIVITY LOG ──────────────────────────────────────────────── */
.iter-row{padding:14px 0;border-bottom:1px solid #F5F7FA;display:flex;gap:12px;align-items:flex-start}
.iter-row:last-child{border-bottom:none}
.iter-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px}
.iter-ver{font-size:11px;font-weight:700;color:#9CA3AF;min-width:34px}
.iter-feedback{background:#FFFBEB;border:1px solid #FDE68A;border-radius:7px;padding:6px 10px;font-size:11px;color:#78350f;margin-top:6px;display:inline-flex;align-items:flex-start;gap:6px;line-height:1.4}

/* ── FILTER CHIPS ───────────────────────────────────────────────── */
.chip{padding:5px 13px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid #E0E5EC;background:#fff;color:#374151;transition:all .14s}
.chip.on{background:#0f1f30;color:#fff;border-color:#0f1f30}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-title{font-size:14px;font-weight:700;color:#1a1a2e}

/* ── MODAL ──────────────────────────────────────────────────────── */
.modal-bg{position:fixed;inset:0;background:rgba(15,31,48,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:500px;box-shadow:0 24px 64px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #E8ECF0;position:sticky;top:0;background:#fff;z-index:1;border-radius:16px 16px 0 0}
.modal-title{font-size:15px;font-weight:700;color:#1a1a2e}
.modal-body{padding:20px}
.modal-ft{padding:13px 20px;border-top:1px solid #E8ECF0;display:flex;gap:10px;justify-content:flex-end}

/* ── FORMS ──────────────────────────────────────────────────────── */
.fg{margin-bottom:14px}
.flbl{display:block;font-size:10px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.req{color:#dc2626;margin-left:2px}
.fi{width:100%;border:1.5px solid #DEE3EB;border-radius:8px;padding:9px 12px;font-size:13px;color:#1a1a2e;outline:none;background:#fff;transition:border-color .15s;box-sizing:border-box}
.fi:focus{border-color:#FF8C00;box-shadow:0 0 0 3px rgba(255,140,0,.12)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Contract builder milestone cards */
.ms-card{border-radius:12px;border:1.5px solid;margin-bottom:12px;overflow:hidden}
.ms-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;user-select:none}
.ms-body-form{padding:0 16px 16px}
.del-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.del-inp{flex:1;border:1.5px solid #DEE3EB;border-radius:7px;padding:7px 10px;font-size:12px;outline:none;background:#fff;box-sizing:border-box}
.del-inp:focus{border-color:#FF8C00}

/* Summary sidebar */
.summary-box{background:#0f1f30;border-radius:12px;padding:18px;color:#fff;margin-top:14px}
.sline{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px}
.sline:last-child{border-bottom:none;font-weight:700;font-size:14px;padding-top:10px}
.slbl{color:rgba(255,255,255,.5)}.sval{color:#fff}

/* Earnings page */
.pay-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid #F5F7FA}
.pay-row:last-child{border-bottom:none}

/* Success */
.success-banner{background:#DCFCE7;border:1.5px solid #86EFAC;border-radius:12px;padding:18px 20px;display:flex;align-items:flex-start;gap:14px;margin-bottom:20px}
.insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}

/* ── LOGIN SCREEN ──────────────────────────────────────────────── */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f1f30 0%,#163352 60%,#1e3a5f 100%)}
.login-card{background:#fff;border-radius:20px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.login-logo{font-size:28px;font-weight:800;color:#1a1a2e;text-align:center;margin-bottom:4px;letter-spacing:-.5px}
.login-logo span{color:#FF8C00}
.login-sub{text-align:center;font-size:12px;color:#9CA3AF;margin-bottom:28px}
.role-btn{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:14px;border:2px solid #E8ECF0;background:#FAFBFC;cursor:pointer;transition:all .18s;margin-bottom:12px;width:100%}
.role-btn:hover{border-color:#FF8C00;background:#FFF8F0;transform:translateY(-1px);box-shadow:0 4px 16px rgba(255,140,0,.12)}
.role-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;color:#fff;font-weight:700}
.role-info{flex:1;text-align:left}
.role-name{font-size:15px;font-weight:700;color:#1a1a2e;margin-bottom:2px}
.role-desc{font-size:11px;color:#9CA3AF}
.role-cta{font-size:12px;font-weight:600;color:#FF8C00;opacity:0;transform:translateX(-4px);transition:all .18s;flex-shrink:0;white-space:nowrap}
.role-btn:hover .role-cta{opacity:1;transform:translateX(0)}
.signup-cta{margin-top:18px;padding-top:14px;border-top:1px solid #E8ECF0;text-align:center}
.signup-cta button{background:none;border:none;font-family:inherit;font-size:13px;font-weight:600;color:#142338;cursor:pointer;padding:6px 12px;border-radius:8px;transition:all .15s}
.signup-cta button:hover{background:#FFF8F0;color:#FF8C00}

/* ── OPEN CONTRACTS ───────────────────────────────────────────── */
.avail-card{background:#fff;border-radius:14px;border:1.5px solid #E8ECF0;overflow:hidden;transition:all .18s;margin-bottom:12px}
.avail-card:hover{box-shadow:0 4px 22px rgba(0,0,0,.09);border-color:#C5D0DE}
.avail-top{padding:18px 20px 14px;display:flex;gap:14px;align-items:flex-start}
.avail-info{flex:1;min-width:0}
.avail-name{font-size:15px;font-weight:700;color:#1a1a2e;margin-bottom:3px}
.avail-desc{font-size:12px;color:#6B7280;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.avail-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:#9CA3AF}
.avail-right{text-align:right;flex-shrink:0}
.avail-budget{font-size:18px;font-weight:800;color:#1a1a2e}
.avail-ms-count{font-size:11px;color:#9CA3AF;margin-top:2px}
.avail-bottom{padding:12px 20px;background:#FAFBFC;border-top:1px solid #F0F4F8;display:flex;align-items:center;justify-content:space-between}
.avail-empty{text-align:center;padding:60px 20px;color:#9CA3AF}
.avail-empty-icon{font-size:48px;margin-bottom:12px}
.urgency-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.urg-high{background:#FEF2F2;color:#dc2626}
.urg-medium{background:#FEF9C3;color:#92400e}
.urg-low{background:#DCFCE7;color:#16a34a}
.accept-btn{background:#FF8C00;color:#fff;border:none;padding:8px 20px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all .14s}
.accept-btn:hover{background:#E07B00;transform:translateY(-1px)}
.confirm-card{border:2px solid #16a34a!important;background:linear-gradient(180deg,#F0FDF4 0%,#fff 100%)}
.confirm-banner{background:#F0FDF4;border:1.5px solid #BBF7D0;border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:10px;margin:14px 20px 0}

function pill(st,type='i'){
  const cfg=type==='i'?ISCFG[st]:PSCFG[st];

  return `<span class="pill ${cfg.pill}">${cfg.lbl}</span>`;

function urgPill(u){const c=URGCFG[u]||URGCFG['medium'];return `<span class="urgency-pill ${c.pill}">${c.lbl}</span>`;}
function avPill(s){const c=AVSCFG[s]||AVSCFG['open'];return `<span class="pill ${c.pill}">${c.lbl}</span>`;}
function starsHtml(rating,interactive,id){
  let h='';const cls=interactive?'star-input stars':'stars';
  for(let i=1;i<=5;i++){
    if(interactive){h+=`<span class="star ${i<=rating?'filled':'empty'}" onclick="setStarRating(${id||0},${i})">★</span>`;}
    else{h+=`<span class="star ${i<=rating?'filled':'empty'}">★</span>`;}
  }
  return `<span class="${cls}">${h}</span>`;
}
function avgRating(fbs){if(!fbs||!fbs.length)return 0;return fbs.reduce((s,f)=>s+f.rating,0)/fbs.length;}
function sentimentBreakdown(fbs){
  let pos=0,neu=0,neg=0;
  fbs.forEach(f=>{if(f.rating>=4)pos++;else if(f.rating===3)neu++;else neg++;});
  return {pos,neu,neg,total:fbs.length};
}
function projFeedback(pid){return G.feedback.filter(f=>f.pid===pid);}
function msPill(st){
  const cfg=MSCFG[st]||MSCFG['upcoming'];

}

// ── SVG CHARTS ────────────────────────────────────────────────────────────────
function barChart(data,kx,ky,color,h=110){
  if(!data.length)return `<div style="height:${h}px;display:flex;align-items:center;justify-content:center;color:#9CA3AF;font-size:12px">No data yet</div>`;
  const w=400,mx=Math.max(...data.map(d=>d[ky]),1),bw=Math.max(6,Math.floor((w-40)/data.length)-8);
  const bars=data.map((d,i)=>{
    const bh=Math.max(4,Math.round((d[ky]/mx)*(h-28))),x=20+i*((w-40)/data.length)+4,y=h-20-bh;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${color}" opacity=".85"/>
            <text x="${x+bw/2}" y="${h-5}" text-anchor="middle" font-size="9" fill="#9CA3AF">${e(d[kx])}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block">${bars}</svg>`;
}
function areaChart(data,kx,ky,color,h=110){
  if(data.length<2)return barChart(data,kx,ky,color,h);
  const w=400,mx=Math.max(...data.map(d=>d[ky]),1);
  const pts=data.map((d,i)=>[20+(i/(data.length-1))*(w-40),8+(1-d[ky]/mx)*(h-32)]);
  const lp=pts.map(([x,y])=>`${x},${y}`).join(' ');
  const ap=`${pts[0][0]},${h-18} ${lp} ${pts[pts.length-1][0]},${h-18}`;
  const lbls=data.map((d,i)=>{const x=20+(i/(data.length-1))*(w-40);return `<text x="${x}" y="${h-4}" text-anchor="middle" font-size="9" fill="#9CA3AF">${e(d[kx])}</text>`;}).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block">
    <defs><linearGradient id="ag${color.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".18"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${ap}" fill="url(#ag${color.slice(1)})"/>
    <polyline points="${lp}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.5" fill="${color}"/>`).join('')}${lbls}</svg>`;
}

function signupUser(){
  const roleEl=document.getElementById('signup-role');

  const newUser={id:uid,name:isBoss?name:name,initials:initials,role:role,gradient:gradient,desc:desc};

}

function toggleOnboardSkill(sk){

function render(){
  const app=document.getElementById('app');
  if(!G.role){app.innerHTML=loginView();return;}
  // Onboarding check for contractors
  if(!G.onboardingComplete){app.innerHTML=onboardingView();return;}
  // Build app shell
  app.innerHTML=`<div class="app" style="display:flex;height:100vh;overflow:hidden">
    ${sidebarHtml()}
    <main class="main" id="main"></main>
  </div>`;
  updateContractNav();
  const main=document.getElementById('main');
  if(G.role==='boss'){
    if(G.view==='boss-dashboard')main.innerHTML=bossView();
    else if(G.view==='boss-post')main.innerHTML=bossPostView();
    else if(G.view==='boss-proposals')main.innerHTML=bossProposalsView();
    else if(G.view==='boss-assigned')main.innerHTML=bossAssignedView();
    else if(G.view==='boss-overview')main.innerHTML=bossOverviewView();
    else main.innerHTML=bossView();
  } else {
    if(G.view==='dashboard')main.innerHTML=dashView();
    else if(G.view==='contract')main.innerHTML=contractDetailView();
    else if(G.view==='earnings')main.innerHTML=earningsView();
    else if(G.view==='new-contract')main.innerHTML=contractBuilderView();
    else if(G.view==='available')main.innerHTML=availableWorkView();
    else if(G.view==='accepted')main.innerHTML=acceptedContractsView();
    else if(G.view==='feedback')main.innerHTML=feedbackView();
  }
}

  const filt=G.projFilter||'all';

// contract actions
function updD(k,v){G.draft[k]=v;render();}
function addMs(){const i=G.draft.milestones.length;G.draft.milestones.push({id:Date.now(),name:'',desc:'',price:'',due:'',dels:[''],open:true,ci:i%MCOLS.length});render();}
function rmMs(mi){G.draft.milestones.splice(mi,1);render();}
function togMs(mi){G.draft.milestones[mi].open=!G.draft.milestones[mi].open;render();}
function updMs(mi,k,v){G.draft.milestones[mi][k]=v;render();}
function addDel(mi){G.draft.milestones[mi].dels.push('');render();}
function rmDel(mi,di){G.draft.milestones[mi].dels.splice(di,1);render();}
function updDel(mi,di,v){G.draft.milestones[mi].dels[di]=v;}
function validateInput(str,maxLen,label){
  const s=String(str||'').trim();
  if(s.length>maxLen){alert(label+' must be '+maxLen+' characters or fewer.');return null;}
  return s;
}
function submitContract(){
  const d=G.draft;
  const name=validateInput(d.name,100,'Contract Name');if(name===null)return;
  const client=validateInput(d.client,100,'Client');if(client===null)return;
  if(!name||!client){alert('Contract Name and Client are required.');return;}
  const desc=validateInput(d.desc,500,'Description');if(desc===null)return;
  const budget=pd(d.budget);
  if(budget<0||budget>10000000){alert('Budget must be between $0 and $10,000,000.');return;}
  const nid=++G.nextId,ci=G.projects.length%PCOLS.length;
  const ms=d.milestones.map((m,i)=>{
    const mName=String(m.name||'').trim().slice(0,100)||'Milestone '+(i+1);
    const mPrice=Math.max(0,Math.min(pd(m.price),10000000));
    return {id:i+1,name:mName,price:mPrice,status:'upcoming',paid:false,due:m.due,dels:m.dels.filter(Boolean).map(dl=>String(dl).slice(0,200))};
  });
  if(ms.length>0)ms[0].status='in-progress';
  G.projects.push({id:nid,ownerId:G.activeUser?G.activeUser.id:'jacob',name:name,client:client,
    desc:desc||d.rateType+' · '+ms.length+' milestones',
    status:'active',budget:budget,rate:d.rateType,color:PCOLS[ci],cat:d.cat,
    tags:[d.rateType.toLowerCase().split('-')[0].trim(),d.cat.toLowerCase().split('/')[0].trim()],
    at:new Date().toISOString().slice(0,10),milestones:ms});
  G.contractOk=true;
  render();
  updateContractNav();
}
function resetDraft(){
  G.draft={name:'',client:'H9 Partners',cat:'Product Design',desc:'',rateType:'Milestone-Based',budget:'',
    milestones:[{id:Date.now(),name:'',desc:'',price:'',due:'',dels:[''],open:true,ci:0}]};
  G.contractOk=false;render();
}

function saveIter(){
  const ver=document.getElementById('iv').value.trim().slice(0,20);
  const title=document.getElementById('it').value.trim().slice(0,150);
  if(!ver||!title){alert('Version and Title are required.');return;}
  const iterId=++G.nextId;
  const fbText=document.getElementById('ifb').value.trim().slice(0,1000);
  const date=document.getElementById('id').value||new Date().toISOString().slice(0,10);
  // Validate date format
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('Invalid date format.');return;}
  const hrs=parseFloat(document.getElementById('ih').value)||0;
  if(hrs<0||hrs>999){alert('Hours must be between 0 and 999.');return;}
  const notes=document.getElementById('in').value.trim().slice(0,2000);
  const status=document.getElementById('is').value;
  const validStatuses=['in-progress','review','testing','complete','blocked'];
  if(!validStatuses.includes(status)){alert('Invalid status.');return;}
  G.iters.push({id:iterId,pid:G.selPid,ver,title,status,hrs,date,notes,feedback:fbText,changes:[]});
  // Create feedback entry if feedback text provided
  if(fbText){
    const p=G.projects.find(p=>p.id===G.selPid);
    G.feedback.push({id:G.nextFeedbackId++,pid:G.selPid,iterId:iterId,msId:null,
      from:p?p.client:'Client',date:date,rating:iterStarRating,text:fbText,response:null,respondedAt:null});
  }
  closeModal();render();
}
function closeModal(){document.getElementById('mc').innerHTML='';}

    return f.budget.some(b=>{
      if(b==='under3k')return a.budget<3000;
      if(b==='3k5k')return a.budget>=3000&&a.budget<=5000;
      if(b==='5kplus')return a.budget>5000;

          ${fo.urgency?`<div class="filter-section-body">
            ${urgLevels.map(u=>{const uc=URGCFG[u]||{};return `<label class="filter-check">
              <input type="checkbox" ${f.urgency.includes(u)?'checked':''} onchange="toggleAvailFilter('urgency','${u}')"/>

        <div class="filter-result-count">${filtered.length} contract${filtered.length!==1?'s':''} ${hasFilters?'match your filters':'available'}</div>

function toggleAvailFilter(type,val){
  const arr=G.availFilter[type];
  const idx=arr.indexOf(val);
  if(idx>=0)arr.splice(idx,1);else arr.push(val);
  render();
}

function submitProposal(availId){
  const a=G.available.find(x=>x.id===availId);if(!a)return;
  const priceInputs=document.querySelectorAll('.proposal-price');
  const proposedPrices=[];
  let total=0;
  priceInputs.forEach(inp=>{const p=Math.max(0,parseFloat(inp.value)||0);proposedPrices.push({msId:parseInt(inp.dataset.msid),price:p});total+=p;});
  const note=(document.getElementById('proposal-note').value||'').trim().slice(0,500);
  G.proposals.push({
    id:G.nextProposalId++,availId:availId,
    contractorId:G.activeUser?G.activeUser.id:'',contractorName:G.activeUser?G.activeUser.name:'',
    proposedPrices:proposedPrices,totalProposed:total,coverNote:note,
    status:'pending',submittedAt:new Date().toISOString().slice(0,10),reviewedAt:null
  });
  closeModal();render();
}
function acceptProposal(propId){
  const prop=G.proposals.find(p=>p.id===propId);if(!prop)return;
  prop.status='boss-accepted';prop.reviewedAt=new Date().toISOString().slice(0,10);
  render();
}
function declineProposal(propId){
  const prop=G.proposals.find(p=>p.id===propId);if(!prop)return;
  if(prop.status!=='pending'&&prop.status!=='boss-accepted')return;
  prop.status='declined';prop.reviewedAt=new Date().toISOString().slice(0,10);
  render();
}
function confirmProposal(propId){
  const prop=G.proposals.find(p=>p.id===propId);if(!prop||prop.status!=='boss-accepted')return;
  const avail=G.available.find(a=>a.id===prop.availId);if(!avail)return;
  prop.status='accepted';prop.confirmedAt=new Date().toISOString().slice(0,10);
  avail.status='claimed';avail.claimedBy=prop.contractorName;avail.claimedAt=prop.confirmedAt;
  // Decline all other pending/boss-accepted proposals for this contract
  G.proposals.filter(p=>p.availId===prop.availId&&p.id!==propId&&(p.status==='pending'||p.status==='boss-accepted')).forEach(p=>{p.status='declined';p.reviewedAt=prop.confirmedAt;});
  // Create project for the winning contractor
  const nid=++G.nextId,ci=G.projects.length%PCOLS.length;
  const milestones=avail.milestones.map((m,i)=>{
    const pp=prop.proposedPrices.find(x=>x.msId===m.id);
    return {id:m.id,name:m.name,desc:m.desc||'',price:pp?pp.price:m.price,status:i===0?'in-progress':'upcoming',paid:false,due:m.due,dels:m.dels?[...m.dels]:[]};
  });
  G.projects.push({id:nid,ownerId:prop.contractorId,name:avail.name,client:'H9 Partners',desc:avail.desc,
    status:'active',color:PCOLS[ci],cat:avail.cat,
    tags:[avail.cat.toLowerCase().split('/')[0].trim(),avail.urgency],
    at:prop.confirmedAt,budget:prop.totalProposed,rate:'Milestone-Based',milestones:milestones,fromAvailId:prop.availId});
  render();
}
function contractorDeclineProposal(propId){
  const prop=G.proposals.find(p=>p.id===propId);if(!prop||prop.status!=='boss-accepted')return;
  prop.status='contractor-declined';prop.contractorDeclinedAt=new Date().toISOString().slice(0,10);
  render();
}

// ── FEEDBACK VIEW ────────────────────────────────────────────────────────────
function feedbackView(){
  let fbs=[...myFeedback()];
  // Filter by contract
  if(G.feedbackFilter&&G.feedbackFilter!=='all'){
    const pid=parseInt(G.feedbackFilter);
    if(!isNaN(pid))fbs=fbs.filter(f=>f.pid===pid);
  }
  // Filter by star rating
  if(G.feedbackStarFilter&&G.feedbackStarFilter!=='all'){
    const r=parseInt(G.feedbackStarFilter);
    if(!isNaN(r))fbs=fbs.filter(f=>f.rating===r);
  }
  // Sort
  if(G.feedbackSort==='oldest')fbs.sort((a,b)=>a.date.localeCompare(b.date));
  else if(G.feedbackSort==='highest')fbs.sort((a,b)=>b.rating-a.rating);
  else if(G.feedbackSort==='lowest')fbs.sort((a,b)=>a.rating-b.rating);
  else fbs.sort((a,b)=>b.date.localeCompare(a.date));

  const allFb=myFeedback();
  const avg=avgRating(allFb);
  const sb=sentimentBreakdown(allFb);
  const ratingDist=[5,4,3,2,1].map(r=>({r,c:allFb.filter(f=>f.rating===r).length}));
  const maxDist=Math.max(...ratingDist.map(d=>d.c),1);

  // Unique projects with feedback
  const projIds=[...new Set(allFb.map(f=>f.pid))];

  const cards=fbs.map(f=>{
    const p=G.projects.find(x=>x.id===f.pid);
    return `<div class="fb-card">

          <div class="fb-card-from">${e(f.from)}</div>
          <div class="fb-card-context">${p?e(p.name):''} · ${fd(f.date)}</div>
          <div class="fb-card-text">${e(f.text)}</div>

      </div>
      ${f.response?`<div class="fb-response">

    </div>`;
  }).join('');

  return `<div class="topbar">
    <div><div class="topbar-title">Feedback</div><div class="topbar-sub">${allFb.length} total feedback entries across all contracts</div></div>
  </div>
  <div class="content">
    <div class="fb-hero">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px">

function updBD(k,v){G.bossDraft[k]=v;render();}
function bossAddMs(){const i=G.bossDraft.milestones.length;G.bossDraft.milestones.push({id:Date.now(),name:'',desc:'',price:'',due:'',dels:[''],open:true,ci:i%MCOLS.length});render();}
function bossRmMs(mi){G.bossDraft.milestones.splice(mi,1);render();}
function bossTogMs(mi){G.bossDraft.milestones[mi].open=!G.bossDraft.milestones[mi].open;render();}
function bossUpdMs(mi,k,v){G.bossDraft.milestones[mi][k]=v;render();}
function bossAddDel(mi){G.bossDraft.milestones[mi].dels.push('');render();}
function bossRmDel(mi,di){G.bossDraft.milestones[mi].dels.splice(di,1);render();}
function bossUpdDel(mi,di,v){G.bossDraft.milestones[mi].dels[di]=v;}
function bossPostContract(){
  const d=G.bossDraft;
  const name=validateInput(d.name,100,'Contract Name');if(name===null)return;
  if(!name){alert('Contract Name is required.');return;}
  const desc=validateInput(d.desc,500,'Description');if(desc===null)return;
  const budget=pd(d.budget);
  if(budget<0||budget>10000000){alert('Budget must be between $0 and $10,000,000.');return;}
  const ms=d.milestones.map((m,i)=>{
    const mName=String(m.name||'').trim().slice(0,100)||'Milestone '+(i+1);
    const mPrice=Math.max(0,Math.min(pd(m.price),10000000));
    return {id:i+1,name:mName,desc:String(m.desc||'').trim().slice(0,200),price:mPrice,due:m.due,dels:m.dels.filter(Boolean).map(dl=>String(dl).slice(0,200))};
  });
  G.available.push({id:G.nextAvailId++,name:name,desc:desc||'',budget:budget,
    cat:d.cat,urgency:d.urgency,status:'open',postedAt:new Date().toISOString().slice(0,10),
    claimedBy:null,claimedAt:null,milestones:ms});
  G.bossDraft={name:'',desc:'',budget:'',cat:'Product Design',urgency:'medium',
    milestones:[{id:Date.now(),name:'',desc:'',price:'',due:'',dels:[''],open:true,ci:0}]};
  nav('boss-dashboard');
}

    </div>
    <div class="filter-row" style="margin-bottom:14px">
      ${[{k:'pending',l:'Pending',c:pending.length},{k:'awaiting',l:'Awaiting',c:bossAccepted.length},{k:'accepted',l:'Confirmed',c:accepted.length},{k:'declined',l:'Declined',c:declined.length},{k:'all',l:'All',c:G.proposals.length}].map(f=>`<button class="chip ${filt===f.k?'on':''}" onclick="G.bossProposalFilter='${f.k}';render()">${f.l} ${f.c}</button>`).join('')}
    </div>
    ${shown.length===0?'<div style="text-align:center;padding:40px;color:#9CA3AF"><div style="font-size:28px;margin-bottom:8px">&#128203;</div>No proposals match this filter</div>':''}
    ${shown.map(p=>{
      const avail=G.available.find(a=>a.id===p.availId);
      const contractName=avail?avail.name:'Unknown Contract';
      const listedBudget=avail?avail.budget:0;
      const diff=p.totalProposed-listedBudget;
      return '<div class="card" style="margin-bottom:12px'+(p.status==='boss-accepted'?';border-left:3px solid #0ea5e9':'')+'"><div style="padding:16px 20px">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">'+
          '<div><div style="font-size:14px;font-weight:700;color:#1a1a2e;margin-bottom:2px">'+e(p.contractorName)+'</div>'+
          '<div style="font-size:12px;color:#9CA3AF">for '+e(contractName)+' · Submitted '+fd(p.submittedAt)+'</div></div>'+
          '<div style="text-align:right"><div style="font-size:18px;font-weight:800;color:'+(p.totalProposed<=listedBudget?'#14A800':'#d97706')+'">'+fmt(p.totalProposed)+'</div>'+
          '<div style="font-size:11px;color:#9CA3AF">Listed: '+fmt(listedBudget)+(diff!==0?' ('+(diff>0?'+':'')+fmt(diff)+')':'')+'</div></div>'+
        '</div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">'+p.proposedPrices.map((pp,i)=>'<div style="padding:4px 10px;background:#F8FAFC;border-radius:6px;font-size:11px;border:1px solid #E8ECF0"><strong>M'+(i+1)+':</strong> '+fmt(pp.price)+'</div>').join('')+'</div>'+
        (p.coverNote?'<div style="font-size:12px;color:#4B5563;font-style:italic;padding:8px 12px;background:#F8FAFC;border-radius:8px;border-left:3px solid #FF8C00;margin-bottom:10px">"'+e(p.coverNote)+'"</div>':'')+
        (p.status==='pending'?'<div style="display:flex;gap:8px"><button class="btn btn-primary btn-sm" onclick="acceptProposal('+p.id+')">&#10003; Accept Proposal</button><button class="btn btn-danger btn-sm" onclick="declineProposal('+p.id+')">&#10005; Decline</button></div>':
         p.status==='boss-accepted'?'<div style="display:flex;align-items:center;gap:10px"><span class="pill p-inprogress" style="padding:6px 14px">&#9203; Awaiting Contractor Confirmation</span><button class="btn btn-danger btn-sm" onclick="declineProposal('+p.id+')">Withdraw</button></div>':
         p.status==='contractor-declined'?'<span class="pill p-blocked">&#10005; Contractor Declined'+(p.contractorDeclinedAt?' &middot; '+fd(p.contractorDeclinedAt):'')+'</span>':
         '<span class="pill '+(p.status==='accepted'?'p-paid':'p-blocked')+'">'+(p.status==='accepted'?'&#10003; Confirmed'+(p.confirmedAt?' &middot; '+fd(p.confirmedAt):''):'&#10005; Declined'+(p.reviewedAt?' &middot; '+fd(p.reviewedAt):''))+'</span>')+
      '</div></div>';
    }).join('')}
  </div>`;
}

// Boss Assigned Contracts View — shows all contracts bound to contractors
function bossAssignedView(){
  const assigned=G.projects.filter(p=>p.fromAvailId);
  const totalValue=assigned.reduce((s,p)=>s+p.budget,0);
  const totalEarned=assigned.reduce((s,p)=>s+earned(p),0);
  // Get contractor names from USERS
  const getContractorName=(oid)=>{const u=USERS.find(x=>x.id===oid);return u?u.name:'Unknown';};

  return `<div class="topbar">
    <div><div class="topbar-title">Assigned Contracts</div><div class="topbar-sub">Contracts awarded to contractors via proposals</div></div>
  </div>
  <div class="content">
    ${assigned.length===0?'<div style="text-align:center;padding:40px;color:#9CA3AF"><div style="font-size:28px;margin-bottom:8px">📋</div><div style="font-size:14px;font-weight:600;margin-bottom:4px">No contracts assigned yet</div><div style="font-size:13px">Accept a contractor proposal to assign a contract.</div></div>':''}
    ${assigned.length?`
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px">
      <div class="dstat" style="border-top:3px solid #FF8C00">
        <div class="dstat-lbl">Assigned</div>
        <div class="dstat-val">${assigned.length}</div>
        <div class="dstat-sub">active contracts</div>
      </div>
      <div class="dstat" style="border-top:3px solid #14A800">
        <div class="dstat-lbl">Total Paid</div>
        <div class="dstat-val" style="color:#14A800">${fmt(totalEarned)}</div>
      </div>
      <div class="dstat" style="border-top:3px solid #0ea5e9">
        <div class="dstat-lbl">Total Value</div>
        <div class="dstat-val">${fmt(totalValue)}</div>
      </div>
    </div>`:''}
    ${assigned.map(p=>{
      const pct=p.budget?Math.round(earned(p)/p.budget*100):0;
      const pc=PSCFG[p.status]||{};
      return `<div class="boss-contractor-card" style="opacity:1">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:10px;height:10px;border-radius:50%;background:${p.color}"></div>
            <span style="font-size:14px;font-weight:700">${e(p.name)}</span>
            <span class="pill ${pc.pill||''}">${pc.lbl||p.status}</span>
          </div>
          <span style="font-size:15px;font-weight:800">${fmt(p.budget)}</span>
        </div>
        <div style="display:flex;gap:18px;font-size:12px;color:#6B7280;align-items:center">
          <span style="font-weight:600;color:#FF8C00">Assigned to: ${e(getContractorName(p.ownerId))}</span>
          <span>Earned: <strong style="color:#14A800">${fmt(earned(p))}</strong></span>
          <span>Milestones: ${p.milestones.filter(m=>m.status==='complete').length}/${p.milestones.length}</span>
          <span>Started ${fd(p.at)}</span>
        </div>
        <div class="pbar" style="margin-top:8px"><div class="pfill" style="width:${pct}%;background:${p.color}"></div></div>
      </div>`;
    }).join('')}
  </div>`;
}

// Boss Contractor Overview
function bossOverviewView(){
  const ps=G.projects;
  const contractors=USERS.filter(u=>u.role==='contractor');
  const totalEarned=ps.reduce((s,p)=>s+earned(p),0);
  const totalBudget=ps.reduce((s,p)=>s+p.budget,0);
  const completedCount=ps.filter(p=>p.status==='complete').length;
  const avgR=avgRating(G.feedback);

  return `<div class="topbar">
    <div><div class="topbar-title">Contractors</div><div class="topbar-sub">${contractors.length} contractor${contractors.length!==1?'s':''} registered</div></div>
  </div>
  <div class="content">
    <div class="boss-hero">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
        <div style="font-size:36px">👥</div>
        <div>
          <div style="font-size:18px;font-weight:700">Contractor Team</div>
          <div style="font-size:12px;color:rgba(255,255,255,.5)">${contractors.length} contractor${contractors.length!==1?'s':''} · ${ps.length} total contracts</div>
        </div>
      </div>
      <div class="boss-stats">
        <div class="boss-stat">
          <div class="earn-lbl">Total Earned</div>
          <div class="earn-val">${fmt(totalEarned)}</div>
        </div>
        <div class="boss-stat">
          <div class="earn-lbl">Completed</div>
          <div class="earn-val">${completedCount}</div>
        </div>
        <div class="boss-stat">
          <div class="earn-lbl">Avg Rating</div>
          <div class="earn-val">${avgR.toFixed(1)}</div>
          <div>${starsHtml(Math.round(avgR))}</div>
        </div>
        <div class="boss-stat">
          <div class="earn-lbl">Total Contracted</div>
          <div class="earn-val">${fmt(totalBudget)}</div>
        </div>
      </div>
    </div>

    ${contractors.map(ctr=>{
      const ctrPs=ps.filter(p=>p.ownerId===ctr.id);
      const ctrEarned=ctrPs.reduce((s,p)=>s+earned(p),0);
      const ctrBudget=ctrPs.reduce((s,p)=>s+p.budget,0);
      const ctrFb=G.feedback.filter(f=>ctrPs.some(p=>p.id===f.pid));
      const ctrAvg=avgRating(ctrFb);
      return `<div class="card" style="margin-bottom:14px">
        <div style="padding:16px 20px;border-bottom:1px solid #F0F4F8">
          <div style="display:flex;align-items:center;gap:12px">
            <div class="avatar" style="width:40px;height:40px;font-size:14px;background:${ctr.gradient}">${e(ctr.initials)}</div>
            <div style="flex:1">
              <div style="font-size:14px;font-weight:700;color:#1a1a2e">${e(ctr.name)}</div>
              <div style="font-size:11px;color:#9CA3AF">${ctrPs.length} contract${ctrPs.length!==1?'s':''} · ${fmt(ctrEarned)} earned · ${ctrFb.length?ctrAvg.toFixed(1)+' ★':'No reviews'}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:16px;font-weight:800">${fmt(ctrBudget)}</div>
              <div style="font-size:10px;color:#9CA3AF">total contracted</div>
            </div>
          </div>
        </div>
        ${ctrPs.length?ctrPs.map(p=>{
          const pct=p.budget?Math.round(earned(p)/p.budget*100):0;
          const pc=PSCFG[p.status]||{};
          return '<div style="padding:10px 20px;border-bottom:1px solid #F5F7FA;display:flex;align-items:center;justify-content:space-between">'+
            '<div style="display:flex;align-items:center;gap:8px"><div style="width:8px;height:8px;border-radius:50%;background:'+p.color+'"></div><span style="font-size:13px;font-weight:600">'+e(p.name)+'</span><span class="pill '+(pc.pill||'')+'">'+(pc.lbl||p.status)+'</span></div>'+
            '<div style="display:flex;gap:14px;font-size:11px;color:#6B7280"><span>'+fmt(earned(p))+' / '+fmt(p.budget)+'</span><span>'+pct+'%</span></div></div>';
        }).join(''):'<div style="padding:16px 20px;font-size:12px;color:#9CA3AF;text-align:center">No contracts yet</div>'}
      </div>`;
    }).join('')}
    ${contractors.length===0?'<div style="text-align:center;padding:40px;color:#9CA3AF"><div style="font-size:28px;margin-bottom:8px">👤</div>No contractors registered yet</div>':''}
  </div>`;
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
render();
</script>
</body>
