# IterateIQ — Supabase project config.
# Generated for Lane A foundation. Adjust project_id after running `supabase link`.

project_id = "iterateiq-h9"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://iterateiq-h9.netlify.app"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false  # Internal H9 launch — pre-seeded users only

[auth.email]
enable_signup = false
enable_confirmations = false  # Pre-seeded users; partners receive password via Slack
double_confirm_changes = true

[storage]
enabled = true
file_size_limit = "50MiB"
